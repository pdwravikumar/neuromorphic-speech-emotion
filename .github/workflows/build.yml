name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Report model status
        run: |
          if [ -f app/src/main/assets/snn_ser.onnx ]; then
            echo "SNN model present: $(du -h app/src/main/assets/snn_ser.onnx | cut -f1)"
          else
            echo "::warning::snn_ser.onnx not in assets - APK runs on StubEmotionClassifier"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NeuroSER-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSER-APK
          path: NeuroSER-${{ github.run_number }}.apk

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NeuroSER build ${{ github.run_number }}
          files: NeuroSER-${{ github.run_number }}.apk
